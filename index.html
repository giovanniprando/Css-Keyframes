<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sequência de Lançamento</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="cinema">
      <div class="bg"></div>

      <div class="stars"></div>

      <div class="linha-topo"></div>

      <section class="hero">
        <h1 class="logo">
          <span>S</span>
          <span>P</span>
          <span>A</span>
          <span>C</span>
          <span>E</span>
          <span>X</span>
        </h1>
      </section>

      <section class="sistema">
        <p>PREPARANDO LANÇAMENTO</p>

        <div class="loader"></div>

        <div class="linha-hud"></div>
      </section>

      <section class="contagem">
        <span class="c3">T-3</span>

        <span class="c2">T-2</span>

        <span class="c1">T-1</span>
      </section>

      <section class="cena-foguete">
        <div class="fumaca fumaca-esquerda"></div>

        <div class="fumaca fumaca-direita"></div>

        <div class="foguete">
          <div class="janela"></div>

          <div class="asa-esquerda"></div>

          <div class="asa-direita"></div>

          <div class="fogo"></div>
        </div>

        <h2 class="decolagem">LANÇAMENTO AUTORIZADO</h2>
      </section>

      <section class="final">
        <h2>O FUTURO COMEÇA AGORA</h2>

        <a href="spacex.html" class="botao"> EXPLORAR O FUTURO </a>
      </section>
    </main>
  </body>
</html>
